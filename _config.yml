title: MATH-CS COMPASS
description: Bridging Pure & Applied Mathematics with Computer Science and Machine Learning
baseurl: ""
url: "https://math-cs-compass.com"
version: 1.0.2

# SEO and Social Media
author: Yusuke Yokota
twitter_username: 
github_username: Yusukey01
facebook_username: Yusuke Yokota

# Site settings for better SEO
lang: en-US
timezone: UTC

# Include .well-known directory for app verification
include:
  - .well-known

# Jekyll plugins (if using GitHub Pages)
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

# Exclude from processing
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# Exclude from sitemap
defaults:
  - scope:
      path: "math_cs_compass_roadmap_2026.html"
    values:
      sitemap: false
  - scope:
      path: "googlea0d426e2c409a113.html"
    values:
      sitemap: false
  - scope:
      path: "offline.html"
    values:
      sitemap: false
  - scope:
      path: "map/vendor"
      values:
      sitemap: false
